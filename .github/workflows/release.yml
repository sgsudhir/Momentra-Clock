name: Build portable flasher

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: installer/launcher/go.mod
      - name: Run firmware host checks
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I main \
            main/clock_config.c main/clock_schedule.c main/clock_freshness.c \
            main/clock_render.c main/clock_scan.c main/clock_form.c main/clock_sound.c \
            tests/test_clock_logic.c -o /tmp/clock-logic-test
          /tmp/clock-logic-test
          cc -std=c11 -Wall -Wextra -Werror -pthread -I tests/stubs -I main \
            main/clock_config.c main/clock_store.c tests/test_clock_store.c -o /tmp/clock-store-test
          /tmp/clock-store-test
          cc -std=c11 -Wall -Wextra -Werror -I main \
            main/clock_config.c main/clock_status.c tests/test_clock_status.c -o /tmp/clock-status-test
          /tmp/clock-status-test | node tests/test_status_json.js
          cc -std=c11 -Wall -Wextra -Werror -I main \
            main/clock_timer_logic.c tests/test_clock_timers.c -o /tmp/clock-timers-test
          /tmp/clock-timers-test
          node tests/test_installer.mjs
      - name: Build and verify factory image
        run: |
          mkdir -p build/release
          docker run --rm -v "$GITHUB_WORKSPACE:/project" -w /project espressif/idf:v6.1 bash -c '
            set -eu
            git config --global --add safe.directory /project
            idf.py -B build/production -D SDKCONFIG=/project/build/production/sdkconfig build
            esptool --chip esp32 merge-bin --flash-mode dio --flash-size 4MB --flash-freq 40m \
              -o build/release/momentra-factory.bin \
              0x1000 build/production/bootloader/bootloader.bin \
              0x8000 build/production/partition_table/partition-table.bin \
              0xf000 build/production/ota_data_initial.bin \
              0x20000 build/production/ESP_P10_Clock_BLR.bin
          '
          jq -e '
            .extra_esptool_args.chip == "esp32" and
            .flash_settings.flash_mode == "dio" and
            .flash_settings.flash_size == "4MB" and
            .flash_settings.flash_freq == "40m" and
            .flash_files == {
              "0x1000": "bootloader/bootloader.bin",
              "0x8000": "partition_table/partition-table.bin",
              "0xf000": "ota_data_initial.bin",
              "0x20000": "ESP_P10_Clock_BLR.bin"
            }
          ' build/production/flasher_args.json
      - name: Bundle and test launcher
        run: |
          npm ci --prefix installer --no-audit --no-fund
          sh installer/prepare-site.sh build/release/momentra-factory.bin
          cd installer/launcher
          go test ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o ../../build/release/momentra-flasher .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o ../../build/release/momentra-flasher.exe .
      - name: Package portable downloads
        run: |
          mkdir -p build/packages/linux build/packages/windows build/packages/assets
          cp build/release/momentra-flasher build/packages/linux/
          cp build/release/momentra-flasher.exe build/packages/windows/
          cp installer/PORTABLE.txt build/packages/linux/README.txt
          cp installer/PORTABLE.txt build/packages/windows/README.txt
          tar -C build/packages/linux -czf build/packages/assets/momentra-flasher-ubuntu-x86_64.tar.gz .
          (cd build/packages/windows && zip -q ../assets/momentra-flasher-windows-x86_64.zip ./*)
          (cd build/packages/assets && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: portable-flasher
          path: build/packages/assets/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portable-flasher
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --title "$TAG" --generate-notes
